#####################
# Font
#####################

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 15.0

#####################
# Window
#####################

window_padding_width 12

background_opacity 0.91

#####################
# Cursor
#####################

shell_intergration no-cursor
cursor_shape block
cursor_blink_interval 0

#####################
# Clipboard
#####################

copy_on_select yes

#####################
# Scrollback
#####################

scrollback_lines 100000

#####################
# Colors
#####################

foreground #f0e6d3
background #000000

selection_foreground #000000
selection_background #ffffff

cursor #f0e6d3
cursor_text_color #000000

color0  #000000
color1  #e8d9c4
color2  #aaaaaa
color3  #999999
color4  #888888
color5  #777777
color6  #666666
color7  #cccccc

color8  #444444
color9  #dddddd
color10 #bbbbbb
color11 #aaaaaa
color12 #ffffff
color13 #888888
color14 #777777
color15 #f0e6d3
